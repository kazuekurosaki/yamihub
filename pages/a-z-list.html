<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Z List - YamiHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark-mode">
    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-10 min-h-screen">
        <div class="mb-10 border-l-4 border-rose-600 pl-4">
            <h1 class="text-3xl font-black uppercase tracking-tighter">A-Z LIST COLLECTION</h1>
            <p class="text-[10px] opacity-40 uppercase tracking-[0.3em]">Urutan koleksi berdasarkan abjad</p>
        </div>

        <div id="post-grid" class="post-grid"></div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../js/main.js"></script>
    <script>
        async function initPage() {
            const sorted = allPosts.sort((a, b) => a.title.localeCompare(b.title));
            renderGrid(sorted);
        }
    </script>
</body>
</html>
