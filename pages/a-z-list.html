<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Z List - YamiHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-10">
        <div class="mb-10">
            <h1 class="text-3xl font-bold border-l-4 border-rose-600 pl-4 uppercase tracking-tighter">A-Z List Video</h1>
            <p class="text-xs opacity-50 mt-2">Daftar seluruh koleksi berdasarkan urutan abjad.</p>
        </div>

        <!-- Grid Container -->
        <div id="post-grid" class="post-grid"></div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
    <script>
        // Logika Khusus A-Z
        async function initAZ() {
            const res = await fetch('.../data/post.json');
            const data = await res.json();
            // Sortir A-Z
            const sorted = data.sort((a, b) => a.title.localeCompare(b.title));
            renderGrid(sorted); // Fungsi dari main.js
        }
        window.onload = initAZ;
    </script>
</body>
</html>
