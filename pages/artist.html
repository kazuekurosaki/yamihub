<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Artists - YamiHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark-mode">
    <div id="header-placeholder"></div>
    <main class="container mx-auto px-4 py-10 min-h-screen">
        <div class="mb-10 border-l-4 border-rose-600 pl-4 text-rose-500">
            <h1 id="cat-title" class="text-3xl font-black uppercase tracking-tighter text-current">ARTISTS</h1>
            <p class="text-[10px] opacity-40 uppercase tracking-[0.3em] text-white">Daftar pemeran populer</p>
        </div>
        <div id="post-grid" class="post-grid"></div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../js/main.js"></script>
    <script>
        async function initPage() {
            const name = new URLSearchParams(window.location.search).get('name');
            const grid = document.getElementById('post-grid');
            if (name) {
                document.getElementById('cat-title').innerText = "ARTIST: " + name;
                renderGrid(allPosts.filter(p => p.artist.includes(name)));
            } else {
                const counts = {};
                allPosts.forEach(p => p.artist.forEach(a => counts[a] = (counts[a] || 0) + 1));
                grid.classList.replace('post-grid', 'grid');
                grid.classList.add('grid-cols-2', 'md:grid-cols-4', 'gap-4');
                grid.innerHTML = Object.keys(counts).sort().map(a => `
                    <a href="?name=${a}" class="glass p-4 text-center hover:border-rose-600 transition-all shadow-lg">
                        <div class="w-12 h-12 bg-rose-600 rounded-full mx-auto mb-3 flex items-center justify-center font-black text-white uppercase">${a[0]}</div>
                        <div class="font-bold text-[10px] uppercase tracking-tighter mb-1">${a}</div>
                        <div class="text-[8px] opacity-40">${counts[a]} VIDEOS</div>
                    </a>
                `).join('');
            }
        }
    </script>
</body>
</html>
