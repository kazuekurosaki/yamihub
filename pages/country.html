<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country - YamiHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark-mode">
    <div id="header-placeholder"></div>
    <main class="container mx-auto px-4 py-10 min-h-screen">
        <div class="mb-10 border-l-4 border-rose-600 pl-4">
            <h1 id="cat-title" class="text-3xl font-black uppercase tracking-tighter">COUNTRY</h1>
            <p class="text-[10px] opacity-40 uppercase tracking-[0.3em]">Filter berdasarkan negara asal</p>
        </div>
        <div id="post-grid" class="post-grid"></div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../js/main.js"></script>
    <script>
        async function initPage() {
            const name = new URLSearchParams(window.location.search).get('name');
            const grid = document.getElementById('post-grid');
            if (name) {
                document.getElementById('cat-title').innerText = "COUNTRY: " + name;
                renderGrid(allPosts.filter(p => p.country === name));
            } else {
                const counts = {};
                allPosts.forEach(p => counts[p.country] = (counts[p.country] || 0) + 1);
                grid.classList.replace('post-grid', 'grid');
                grid.classList.add('grid-cols-1', 'md:grid-cols-2', 'gap-4');
                grid.innerHTML = Object.keys(counts).sort().map(c => `
                    <a href="?name=${c}" class="glass p-6 flex items-center gap-4 hover:bg-rose-600/10 transition-all shadow-xl">
                        <span class="text-2xl">🏳️</span>
                        <div class="flex-1">
                            <div class="font-black uppercase tracking-widest text-xs">${c}</div>
                            <div class="text-[9px] opacity-40">${counts[c]} TOTAL CONTENT</div>
                        </div>
                        <span class="text-rose-500">▶</span>
                    </a>
                `).join('');
            }
        }
    </script>
</body>
</html>
