<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks - YamiHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark-mode">
    <div id="header-placeholder"></div>
    <main class="container mx-auto px-4 py-10 min-h-screen">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-black uppercase tracking-tighter text-rose-600">FAVORITE LIST</h1>
            <p class="text-[10px] opacity-40 uppercase tracking-[0.4em]">Koleksi video pilihan Anda</p>
        </div>

        <div id="post-grid" class="post-grid"></div>

        <!-- Empty State -->
        <div id="empty-msg" class="hidden py-20 text-center fade-in">
            <div class="text-5xl mb-4 opacity-20">📂</div>
            <p class="opacity-40 italic text-sm">Belum ada video yang di-bookmark.</p>
            <a href="../index.html" class="inline-block mt-6 px-8 py-2.5 border border-rose-600 text-rose-500 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-rose-600 hover:text-white transition">Cari Video</a>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../js/main.js"></script>
    <script>
        async function initPage() {
            const favIds = JSON.parse(localStorage.getItem('yamihub_fav')) || [];
            if (favIds.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                return;
            }
            const bookmarkedData = allPosts.filter(p => favIds.includes(p.id));
            renderGrid(bookmarkedData);
        }
    </script>
</body>
</html>
