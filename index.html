<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Master -->
    <title>YamiHub - Premium Glassmorphism Streaming Platform</title>
    <meta name="description" content="Nonton streaming video terlengkap dengan kualitas HD. Fitur Dark Mode, SFW/NSFW, dan daftar artis terlengkap.">
    <meta name="keywords" content="streaming, nonton online, film terbaru, yamihub, glassmorphism">

    <!-- CSS & Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">

    <!-- Placeholder Header (Diisi oleh main.js) -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <header class="container mx-auto px-4 mt-6">
        <div class="glass p-8 md:p-12 relative overflow-hidden group">
            <div class="relative z-10 max-w-2xl">
                <h2 class="text-3xl md:text-5xl font-black text-rose-600 tracking-tighter mb-4">EXPLORE PREMIUM CONTENT</h2>
                <p class="text-xs md:text-sm opacity-60 leading-relaxed mb-6">Nikmati pengalaman menonton dengan UI Glassmorphism yang modern, cepat, dan responsif di semua perangkat.</p>
                <div class="flex gap-3">
                    <a href="#post-grid" class="bg-rose-600 text-white px-6 py-2.5 rounded-full text-[11px] font-bold shadow-lg shadow-rose-900/40 hover:scale-105 transition">MULAI NONTON</a>
                </div>
            </div>
            <!-- Dekorasi Ikon Belakang -->
            <div class="absolute right-[-20px] bottom-[-20px] opacity-5 pointer-events-none group-hover:scale-110 transition duration-700">
                <svg width="300" height="300" fill="currentColor" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-10 14.5v-9l6 4.5-6 4.5z"/></svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 mt-10 min-h-screen">
        <!-- Label Section -->
        <div class="flex items-center justify-between mb-6 border-l-4 border-rose-600 pl-4">
            <div>
                <h2 class="text-xl font-black tracking-tighter uppercase italic">Terbaru & Populer</h2>
                <p class="text-[9px] opacity-40 uppercase tracking-widest">Update harian konten terbaik</p>
            </div>
        </div>

        <!-- Grid Post (Diisi oleh main.js) -->
        <div id="post-grid" class="post-grid">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center opacity-20 italic">Memuat konten...</div>
        </div>

        <!-- Pagination Button -->
        <div class="text-center mt-14 mb-20">
            <button id="load-more-btn" onclick="currentLimit += 10; renderGrid()" class="px-12 py-3.5 glass bg-rose-600/10 border-rose-600/20 text-rose-500 rounded-full text-[11px] font-black tracking-widest hover:bg-rose-600 hover:text-white transition-all shadow-2xl">
                TAMPILKAN LEBIH BANYAK
            </button>
        </div>
    </main>

    <!-- Placeholder Footer (Diisi oleh main.js) -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>
</html>
